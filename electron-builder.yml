appId: com.electron.app # 改名后不变：macOS 的权限授予和 Windows 安装的升级都认它
productName: 识屏
extraMetadata:
  # Windows exe 的 FileDescription 取自 description，任务管理器「进程」页显示的就是它；package.json 的那句长介绍留给仓库
  description: Shiping
directories:
  buildResources: build
# 只列运行要用的，仓库里新加的文件（文档、演示动图、工具配置、relay/ 等）就不会悄悄打进安装包。
# package.json 和生产依赖由 electron-builder 自己带上；手机同步的局域网页面在构建时已打进 out/main
files:
  - out/**
  - resources/** # 托盘图标等，见下面的 asarUnpack
  - LICENSE
asarUnpack:
  - resources/**
afterPack: build/after-pack.mjs # macOS 由它用自签名证书签名，原因见文件开头
win:
  executableName: Shiping # 任务管理器「详细信息」页显示的文件名；快捷方式和卸载列表仍用 productName「识屏」
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  identity: null # 关掉 electron-builder 自带的签名，改由 afterPack 签
  publish: null # macOS 版没有 Apple 签名，不做自动更新；应用内只提示新版本并链接到发布页
  # 系统弹权限框时显示的用途说明。要写成映射：写成列表会原样进 Info.plist，成了系统读不到的 "0"…"3" 键。
  # 没写的沿用 Electron 自带的英文说明（摄像头等，用不到，不会弹框）
  extendInfo:
    NSMicrophoneUsageDescription: 识屏需要使用麦克风，把你在「设置 → 语音」选择的麦克风里的声音转成文字。
    NSAudioCaptureUsageDescription: 识屏需要录制系统音频，把电脑里播放的声音（如线上会议里对方的发言）转成文字。
    NSDocumentsFolderUsageDescription: 识屏需要访问「文稿」文件夹，用来保存对话记录，或重新导入从这里导入的资料。
    NSDownloadsFolderUsageDescription: 识屏需要访问「下载」文件夹，用来重新导入从这里导入的资料。
  notarize: false
dmg:
  # macOS 只构建 CI runner 所在架构（arm64），文件名带上架构避免误下载
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: ooboqoo
  repo: shiping
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
