<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>识屏</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="topbar">
      <nav class="segmented" role="tablist">
        <button role="tab" data-tab="screenshot" class="active">
          截图解答<i class="unseen"></i>
        </button>
        <button role="tab" data-tab="conversation">对话提示<i class="unseen"></i></button>
      </nav>
      <div class="tools">
        <button id="awake" class="icon-button" aria-label="屏幕常亮" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        </button>
        <button id="font-size" class="icon-button" aria-label="字号">
          <span class="small">A</span><span>A</span>
        </button>
        <span id="status" class="status connecting"><i></i><span>连接中</span></span>
      </div>
    </header>
    <div id="banner" hidden></div>

    <main>
      <section id="screenshot">
        <div id="answer-meta" class="chips"></div>
        <div id="answer-error" class="error-box" hidden></div>
        <article id="answer" class="markdown"></article>
      </section>
      <section id="conversation" hidden>
        <div id="listen-meta" class="chips"></div>
        <div id="listen-error" class="error-box" hidden></div>
        <div id="hints"></div>
      </section>
    </main>

    <template id="empty-screenshot">
      <div class="empty">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <div class="title">等待截图</div>
        <div class="hint">在电脑上按截图快捷键，解答会实时出现在这里</div>
      </div>
    </template>
    <template id="empty-conversation">
      <div class="empty">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z" />
          <path d="M8.5 11h.01M12 11h.01M15.5 11h.01" />
        </svg>
        <div class="title">等待对话</div>
        <div class="hint">在电脑上进入对话模式并开始监听，对方的话和提示会出现在这里</div>
      </div>
    </template>

    <button id="jump" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
      有新内容
    </button>
    <div id="toast" hidden></div>

    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
