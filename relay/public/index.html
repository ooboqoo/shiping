<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>识屏</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="topbar">
      <nav class="segmented" role="tablist">
        <button role="tab" data-tab="screenshot" class="active">
          截图解答<i class="unseen"></i>
        </button>
        <button role="tab" data-tab="conversation">对话提示<i class="unseen"></i></button>
      </nav>
      <div class="tools">
        <button id="awake" class="icon-button" aria-label="屏幕常亮" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        </button>
        <button id="font-size" class="icon-button" aria-label="字号">
          <span class="small">A</span><span>A</span>
        </button>
        <span id="status" class="status connecting"><i></i><span>连接中</span></span>
      </div>
    </header>
    <div id="banner" hidden></div>

    <main>
      <section id="screenshot">
        <div id="answer-meta" class="chips"></div>
        <div id="answer-error" class="error-box" hidden></div>
        <article id="answer" class="markdown"></article>
      </section>
      <section id="conversation" hidden>
        <div id="listen-meta" class="chips"></div>
        <div id="listen-error" class="error-box" hidden></div>
        <div id="hints"></div>
      </section>
    </main>

    <template id="empty-screenshot">
      <div class="empty">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <div class="title">等待截图</div>
        <div class="hint">按电脑上的截图快捷键，或点下面的「截图」，解答会实时出现在这里</div>
      </div>
    </template>
    <template id="empty-conversation">
      <div class="empty">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z" />
          <path d="M8.5 11h.01M12 11h.01M15.5 11h.01" />
        </svg>
        <div class="title">等待对话</div>
        <div class="hint">在电脑上开始监听，或点下面的「开始监听」，对方的话和提示会出现在这里</div>
      </div>
    </template>

    <!-- One row per mode, as on the desktop's 极简悬浮条; `data-mode` buttons show with their tab -->
    <footer id="controls">
      <button
        data-command="screenshot"
        data-mode="screenshot"
        class="primary"
        aria-label="截图并解答"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <span>截图</span>
      </button>
      <button data-command="append" data-mode="screenshot" aria-label="追加截图">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"
          />
          <path d="M12 8.5v7M8.5 12h7" />
        </svg>
        <span>追加</span>
      </button>
      <button
        data-command="hint"
        data-mode="conversation"
        class="primary"
        aria-label="出提示"
        hidden
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"
          />
          <path d="M9 18h6M10 22h4" />
        </svg>
        <span>出提示</span>
      </button>
      <button
        id="listen"
        data-command="listen"
        data-mode="conversation"
        aria-pressed="false"
        hidden
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" />
        </svg>
        <span id="listen-label">开始监听</span>
      </button>
      <button data-command="stop" aria-label="停止生成">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="2" />
        </svg>
        <span>停止</span>
      </button>
      <button data-command="pageUp" aria-label="上翻一页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
        <span>上翻</span>
      </button>
      <button data-command="pageDown" aria-label="下翻一页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        <span>下翻</span>
      </button>
    </footer>

    <button id="jump" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
      有新内容
    </button>
    <div id="toast" hidden></div>

    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
